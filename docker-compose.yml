services:
  # Sentinel service: main FastAPI app orchestrating the detection pipeline
  sentinel:
    build: .
    container_name: igusentinel-sentinel
    networks:
      - prod-net
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    depends_on:
      - diode

  # Diode container: one-way relay with iptables enforcement
  # Enforces unidirectional traffic via iptables rules
  # Attached to both bridge networks (prod-net, enclave-net) and macvlan networks
  diode:
    image: busybox:latest
    networks:
      - prod-net
      - enclave-net
      - macvlan-prod
      - macvlan-enclave
    container_name: igusentinel-diode
    cap_add:
      - NET_ADMIN
    entrypoint: /bin/sh
    command:
      - -c
      - |
        echo 'Diode: setting up iptables one-way relay rules'
        echo 1 > /proc/sys/net/ipv4/ip_forward
        iptables -P FORWARD DROP
        iptables -A FORWARD -i eth0 -o eth1 -j ACCEPT
        iptables -A FORWARD -i eth1 -o eth0 -j DROP
        echo 'iptables rules: FORWARD DROP default, eth0->eth1 ACCEPT, eth1->eth0 DROP'
        echo 'Diode online'
        exec sleep infinity
    restart: unless-stopped

  # Router service: macvlan-attached gateway endpoint for host routing sandbox
  # Provides stable gateway IPs on macvlan-prod and macvlan-enclave networks
  # Does not run application logic; host routes traffic through this container
  router:
    image: busybox:latest
    networks:
      macvlan-prod:
        ipv4_address: 192.168.2.254
      macvlan-enclave:
        ipv4_address: 192.168.3.254
    container_name: igusentinel-router
    cap_add:
      - NET_ADMIN
    entrypoint: /bin/sh
    command:
      - -c
      - |
        echo 'Router: gateway endpoint online'
        echo 'Prod side IP: 192.168.2.254'
        echo 'Enclave side IP: 192.168.3.254'
        echo 'Waiting for sandbox setup...'
        exec sleep infinity
    restart: unless-stopped

  # Test container on prod-net
  prod-test:
    image: busybox:latest
    networks:
      - prod-net
    command: sleep 3600
    container_name: igusentinel-prod-test
    restart: unless-stopped

  # Test container on enclave-net
  enclave-test:
    image: busybox:latest
    networks:
      - enclave-net
    command: sleep 3600
    container_name: igusentinel-enclave-test
    restart: unless-stopped

  # Traffic generator: runs all 6 threat-class configs via runner.py --all
  traffic-gen:
    build: .
    networks:
      - prod-net
    container_name: igusentinel-traffic-gen
    command: ["python", "-m", "igu_sentinel.traffic_gen.runner", "--all"]
    restart: on-failure
    environment:
      - PYTHONUNBUFFERED=1

networks:
  prod-net:
    driver: bridge
    name: prod-net

  enclave-net:
    driver: bridge
    name: enclave-net

  # Macvlan networks for host-routing sandbox
  # Attached to host's physical interface (wlp8s0)
  macvlan-prod:
    driver: macvlan
    driver_opts:
      parent: wlp8s0
    ipam:
      config:
        - subnet: 192.168.2.0/24
          gateway: 192.168.2.1
    name: macvlan-prod

  macvlan-enclave:
    driver: macvlan
    driver_opts:
      parent: wlp8s0
    ipam:
      config:
        - subnet: 192.168.3.0/24
          gateway: 192.168.3.1
    name: macvlan-enclave
