services:
  # Sentinel service: main FastAPI app orchestrating the detection pipeline
  sentinel:
    build: .
    container_name: igusentinel-sentinel
    networks:
      - prod-net
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    depends_on:
      - diode

  # Diode container: one-way relay with iptables enforcement
  # Enforces unidirectional traffic via iptables rules
  diode:
    image: busybox:latest
    networks:
      - prod-net
      - enclave-net
    container_name: igusentinel-diode
    cap_add:
      - NET_ADMIN
    entrypoint: /bin/sh
    command:
      - -c
      - |
        echo 'Diode: setting up iptables one-way relay rules'
        echo 1 > /proc/sys/net/ipv4/ip_forward
        iptables -P FORWARD DROP
        iptables -A FORWARD -i eth0 -o eth1 -j ACCEPT
        iptables -A FORWARD -i eth1 -o eth0 -j DROP
        echo 'iptables rules: FORWARD DROP default, eth0->eth1 ACCEPT, eth1->eth0 DROP'
        echo 'Diode online'
        exec sleep infinity
    restart: unless-stopped

  # Test container on prod-net
  prod-test:
    image: busybox:latest
    networks:
      - prod-net
    command: sleep 3600
    container_name: igusentinel-prod-test
    restart: unless-stopped

  # Test container on enclave-net
  enclave-test:
    image: busybox:latest
    networks:
      - enclave-net
    command: sleep 3600
    container_name: igusentinel-enclave-test
    restart: unless-stopped

  # Traffic generator: DDoS variant generation
  traffic-gen-ddos:
    image: python:3.11-slim
    networks:
      - prod-net
    container_name: igusentinel-traffic-gen-ddos
    working_dir: /app
    volumes:
      - ./igu_sentinel:/app/igu_sentinel:ro
      - ./igu_sentinel/traffic_gen/config/ddos.yaml:/config/ddos.yaml:ro
    command: python -m igu_sentinel.traffic_gen.runner /config/ddos.yaml
    restart: on-failure
    environment:
      - PYTHONUNBUFFERED=1

  # Traffic generator: C2 beaconing variant generation
  traffic-gen-beaconing:
    image: python:3.11-slim
    networks:
      - prod-net
    container_name: igusentinel-traffic-gen-beaconing
    working_dir: /app
    volumes:
      - ./igu_sentinel:/app/igu_sentinel:ro
      - ./igu_sentinel/traffic_gen/config/beaconing.yaml:/config/beaconing.yaml:ro
    command: python -m igu_sentinel.traffic_gen.runner /config/beaconing.yaml
    restart: on-failure
    environment:
      - PYTHONUNBUFFERED=1

  # Traffic generator: recon/scanning variant generation
  traffic-gen-scanning:
    image: python:3.11-slim
    networks:
      - prod-net
    container_name: igusentinel-traffic-gen-scanning
    working_dir: /app
    volumes:
      - ./igu_sentinel:/app/igu_sentinel:ro
      - ./igu_sentinel/traffic_gen/config/scanning.yaml:/config/scanning.yaml:ro
    command: python -m igu_sentinel.traffic_gen.runner /config/scanning.yaml
    restart: on-failure
    environment:
      - PYTHONUNBUFFERED=1

  # Traffic generator: DNS tunneling/DGA variant generation
  traffic-gen-dns:
    image: python:3.11-slim
    networks:
      - prod-net
    container_name: igusentinel-traffic-gen-dns
    working_dir: /app
    volumes:
      - ./igu_sentinel:/app/igu_sentinel:ro
      - ./igu_sentinel/traffic_gen/config/dns_tunneling.yaml:/config/dns_tunneling.yaml:ro
    command: python -m igu_sentinel.traffic_gen.runner /config/dns_tunneling.yaml
    restart: on-failure
    environment:
      - PYTHONUNBUFFERED=1

  # Traffic generator: encrypted malware variant generation
  traffic-gen-malware:
    image: python:3.11-slim
    networks:
      - prod-net
    container_name: igusentinel-traffic-gen-malware
    working_dir: /app
    volumes:
      - ./igu_sentinel:/app/igu_sentinel:ro
      - ./igu_sentinel/traffic_gen/config/encrypted_malware.yaml:/config/encrypted_malware.yaml:ro
    command: python -m igu_sentinel.traffic_gen.runner /config/encrypted_malware.yaml
    restart: on-failure
    environment:
      - PYTHONUNBUFFERED=1

  # Traffic generator: data exfiltration variant generation
  traffic-gen-exfil:
    image: python:3.11-slim
    networks:
      - prod-net
    container_name: igusentinel-traffic-gen-exfil
    working_dir: /app
    volumes:
      - ./igu_sentinel:/app/igu_sentinel:ro
      - ./igu_sentinel/traffic_gen/config/exfiltration.yaml:/config/exfiltration.yaml:ro
    command: python -m igu_sentinel.traffic_gen.runner /config/exfiltration.yaml
    restart: on-failure
    environment:
      - PYTHONUNBUFFERED=1

networks:
  prod-net:
    driver: bridge
    name: prod-net

  enclave-net:
    driver: bridge
    name: enclave-net
