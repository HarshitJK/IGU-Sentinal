name: CI

# There was no CI at all: the only signal that anything worked was a developer
# remembering to run pytest locally, on a machine whose .venv had drifted.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # tshark is what ingest/ shells out to. Without it the live-capture tests
      # exercise only the error path.
      - name: Install tshark
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y tshark

      - name: Run test suite
        run: pytest -v

      # Throughput is a graded requirement (CLAUDE.md), so the number is
      # produced on every run rather than quoted from memory.
      - name: Benchmark pipeline
        run: python -m igu_sentinel.benchmark --flows 2000 --repeats 3

  docker:
    name: container stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build images
        run: docker compose build

      # The diode is the security boundary. Proving the return path is blocked
      # is the one integration test that must not be allowed to silently skip.
      - name: Bring up stack and prove the diode blocks the return path
        run: |
          docker compose up -d
          sleep 10
          docker compose ps
          echo "--- diode logs ---"
          docker compose logs diode
          # The diode must have verified its own rules and reported ready.
          docker compose logs diode | grep -q 'Diode online'
          echo "--- return-path test (must FAIL to pass) ---"
          if docker exec igusentinel-prod-test ping -c 1 -W 2 igusentinel-enclave-test; then
            echo "FAIL: return traffic reached the enclave"
            exit 1
          fi
          echo "PASS: return traffic blocked"

      - name: Tear down
        if: always()
        run: docker compose down -v
